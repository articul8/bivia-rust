name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check
      - name: Clippy
        run: cargo clippy -- -D warnings || true
